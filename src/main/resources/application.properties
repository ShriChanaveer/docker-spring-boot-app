# Application Name
spring.application.name=spring-boot-app

# Server Configuration
server.port=${SERVER_PORT:8080}

# Actuator Configuration
# Only expose health and info endpoints for security
# Add Spring Security dependency and configure authentication if you need metrics/env endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.defaults.enabled=true

# For production with security enabled, uncomment and configure:
# management.endpoints.web.exposure.include=health,info,metrics,env
# spring.security.user.name=${ACTUATOR_USERNAME:admin}
# spring.security.user.password=${ACTUATOR_PASSWORD:change-this-password}

# Logging Configuration
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.example.app=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n

